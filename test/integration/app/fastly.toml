# Local-only manifest used by the integration tests.
# The resources defined here are what the test app expects to find at runtime.

manifest_version = 3
name = "compute-js-context-integration-test"
language = "javascript"

[local_server]

  [local_server.backends]
    [local_server.backends.origin]
      url = "http://127.0.0.1:1"
    [local_server.backends.origin-renamed]
      url = "http://127.0.0.1:2"

  [local_server.config_stores]
    [local_server.config_stores.my_config]
      format = "inline-toml"
      [local_server.config_stores.my_config.contents]
        greeting = "hello"

  [local_server.kv_stores]
    [[local_server.kv_stores.my_kv]]
      key = "item"
      data = "kv-value"

  [local_server.secret_stores]
    [[local_server.secret_stores.my_secrets]]
      key = "token"
      data = "not-a-real-secret"

  [local_server.acls]
    my_acl = "fixtures/acl.json"
